# Operator-owned desired state for `benchmark fleet`.
# Keep `experiments` empty until the model/provider and arms are intentionally selected.

defaults:
  profile: configs/profiles/opencode-x-preview-f-free-high.yaml
  runs: 1
  jobs: 5
  rework_attempts: 2
  transient_retries: 0
  interval: 30
  max_restarts: 3

harnesses:
  python-harness: {}
  # Example for a not-yet-wired arm:
