# Docker env for arms that must reach host localhost services (e.g. SuperMemory :6767).
# Same as SCB docker-python3.12-uv, but network=host so 127.0.0.1 inside the container
# is the host loopback (Linux). Embeddings stay on the local supermemory-server.
# Keep name=python3.12 so we reuse the existing slop-code:python3.12 base image.
type: docker
name: python3.12
docker:
  image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
  workdir: /workspace
  mount_workspace: true
  network: host
environment:
  env:
    UV_CACHE_DIR: /tmp/uv-cache
    PIP_CACHE_DIR: /tmp/pip-cache-dir
    PIP_CONFIG_FILE: /tmp/pip-conf
setup:
  eval_commands:
    - uv init
    - uv add -r requirements.txt
  resume_commands:
    - python -m venv .venv || true
    - .venv/bin/pip install -r requirements.txt 2>/dev/null || true
commands:
  entry_file: "{entry_file}.py"
  command: uv run
  agent_command: "python"
