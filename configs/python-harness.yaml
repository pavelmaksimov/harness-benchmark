# Python Harness arm for the realworld OpenCode profile.
agent: configs/agent_opencode.yaml
environment: docker-python3.12-uv-hostnet
prompt: configs/prompts/python-harness-solve.jinja
model:
  provider: opencode_auth
  name: x-preview-f-free
thinking: high
pass_policy: all-core-cases
problems:
  - realworld
save_dir: results/raw
save_template: ${model.name}/python_harness_${prompt}_${thinking}_${now:%Y%m%dT%H%M%S}
