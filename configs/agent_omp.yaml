# omp (oh-my-pi) CLI agent for SlopCodeBench.
# Prebuilt omp binary installed by benchmark/assets/omp.docker.j2; must match
# the omp_cli_version pin in vendor/pins.json.
type: omp
binary: /tmp/agent_home/.local/bin/omp
provider: openrouter
version: "18.0.4"
env: {}
cost_limits:
  cost_limit: 25
  step_limit: 0
  net_cost_limit: 0
